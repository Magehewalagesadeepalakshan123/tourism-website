
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Travel Lanka | Register</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >
</head>

<body>

<div class="login-container">

    <!-- LEFT SIDE -->

    <div class="login-left">

        <div class="brand">
            <h2>Travel Lanka</h2>
        </div>

        <div class="welcome-text">

            <h1>
                Start Your
                <span>Journey Today</span>
            </h1>

            <p>
                Create your account and discover amazing
                destinations, tour packages and unforgettable
                experiences around Sri Lanka.
            </p>

        </div>

    </div>


    <!-- RIGHT SIDE -->

    <div class="login-right">

        <form
            class="login-card"
            id="registerForm"
        >

            <h2>Create Account</h2>

            <p class="subtitle">
                Join Travel Lanka and start exploring
            </p>


            <!-- FULL NAME -->

            <div class="input-group">

                <label>Full Name</label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="input-group">

                <label>Email Address</label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="input-group">

                <label>Password</label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Create a password"
                    required
                >

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="input-group">

                <label>Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn"
            >
                Create Account
            </button>


            <p id="registerMessage"></p>


            <div class="register">

                Already have an account?

                <a href="../index.html">
                    Login
                </a>

            </div>

        </form>

    </div>

</div>


<script src="../js/register.js"></script>

</body>

</html>
